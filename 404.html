<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Đang chuyển hướng...</title>
    <script>
      // GitHub Pages trả 404.html cho mọi deep link của SPA.
      // Chuyển về trang gốc của repo kèm đường dẫn trong query (?/dashboard/orders).
      (function () {
        var pathSegmentsToKeep = 1; // /Construction_materials_management
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
      })();
    </script>
  </head>
  <body>Đang chuyển hướng...</body>
</html>
