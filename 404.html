<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Đang chuyển hướng...</title>
    <script>
      // GitHub Pages serve file này cho mọi URL không tồn tại (deep link của SPA).
      // Chuyển về index.html kèm đường dẫn gốc trong query để index.html khôi phục.
      (function () {
        var base = window.location.pathname.replace(/\/404\.html$/, '/');
        var path = window.location.pathname.slice(base.length);
        var search = window.location.search ? window.location.search.replace('?', '&') : '';
        window.location.replace(base + '?/' + path + search);
      })();
    </script>
  </head>
  <body>Đang chuyển hướng...</body>
</html>
