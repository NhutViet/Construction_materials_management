  <body class="bod">
    <div id="root">
      
    </div>
    
    <script>
      // GitHub Pages trả 404.html cho mọi deep link. Khôi phục lại đường dẫn
      // mà 404.html đã nhét vào query (?/dashboard/orders) trước khi React chạy.
      (function () {
        var l = window.location;
        if (l.search[1] !== '/') return;
        var decoded = l.search
          .slice(1)
          .split('&')
          .map(function (part) {
            return part.replace(/~and~/g, '&');
          })
          .join('?');
        window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
      })();
    </script>
  </body>
