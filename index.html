<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./public/app.css"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React</title>
  </head>
  <body class="bod">
    <div id="root">
      
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // GitHub Pages trả 404.html cho mọi deep link. Khôi phục lại đường dẫn
      // mà 404.html đã nhét vào query (?/dashboard/orders) trước khi React chạy.
      (function () {
        var q = window.location.search;
        if (q.indexOf('?/') !== 0) return;
        var moduleScript = document.querySelector('script[type="module"][src*="assets/"]');
        var base = moduleScript ? moduleScript.src.replace(/\/assets\/.*$/, '/') : '/';
        var path = q.slice(2).split('&')[0];
        window.history.replaceState(null, '', base + path);
      })();
    </script>
  </body>
</html>
